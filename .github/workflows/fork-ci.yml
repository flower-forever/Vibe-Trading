name: Fork verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  PYTHONUTF8: '1'

jobs:
  backend:
    name: Backend / Linux
    if: github.repository == 'flower-forever/Vibe-Trading'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research and tested channel dependencies
        run: python -m pip install -e '.[dev,openbb,stats,anthropic,matrix,slack,telegram]'
      - name: Validate automation and repository checks
        run: |
          python -m pytest tools/test_fork_sync.py tools/test_ci_private_files_gate.py -q
          python tools/ci_private_files_gate.py
          python tools/ci_env_var_gate.py
      - name: Run backend tests without live model E2E
        shell: bash
        run: |
          python -m pytest --ignore=agent/tests/e2e_backtest --ignore=agent/tests/test_e2e_harness_v2.py \
            --junitxml="$RUNNER_TEMP/backend.xml" --tb=short -q 2>&1 | tee "$RUNNER_TEMP/backend.log"
      - name: Retain backend results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-linux
          path: |
            ${{ runner.temp }}/backend.xml
            ${{ runner.temp }}/backend.log
          retention-days: 14

  frontend:
    name: Frontend
    if: github.repository == 'flower-forever/Vibe-Trading'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, build and test frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build 2>&1 | tee "$RUNNER_TEMP/frontend-build.log"
          npm run test:run -- --reporter=dot 2>&1 | tee "$RUNNER_TEMP/frontend-tests.log"
      - name: Retain frontend results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend
          path: ${{ runner.temp }}/frontend-*.log
          retention-days: 14

  windows:
    name: Local customizations / Windows
    if: github.repository == 'flower-forever/Vibe-Trading'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check retained tools, providers and native job persistence
        shell: pwsh
        run: |
          python -m pytest agent/tests/test_report_integrity_tools.py agent/tests/test_cline_compatibility.py agent/tests/test_opencode_provider.py agent/tests/test_runtime_jobstore.py --junitxml="$env:RUNNER_TEMP/windows.xml" --tb=short -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows.log"
          exit $LASTEXITCODE
      - name: Retain Windows results including existing failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-customizations
          path: |
            ${{ runner.temp }}/windows.xml
            ${{ runner.temp }}/windows.log
          retention-days: 14
